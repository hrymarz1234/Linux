name: Build, Test, and Deploy to GitHub Pages

on:
  push:
    branches:
      [ "Branch01" ]
  pull_request:
    branches:
      [ "Branch01" ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest  # Workflow uruchamiany na maszynie Ubuntu

    steps:
      # 1. Pobranie kodu repozytorium
      - name: Check out the repository
        uses: actions/checkout@v3

      # 2. Instalacja Node.js (zakładając, że to aplikacja Node.js/JavaScript)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Wybierz wersję Node.js zgodną z Twoim projektem

      # 3. Instalacja zależności
      - name: Install dependencies
        run: |
          npm install  # Jeśli używasz yarn, zastąp npm install przez yarn install

      # # 4. Uruchomienie testów aplikacji
      # - name: Run tests
      #   run: |
      #     npm test  # Uruchamia testy jednostkowe

      # 5. Budowanie aplikacji (np. dla aplikacji React)
      - name: Build application
        run: |
          npm run build  # Zakładając, że masz skrypt "build" w package.json

      # 6. Publikowanie na GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # ścieżka do zbudowanej aplikacji
          folder: ./build  # Dla React/Vue/etc. folder "build" jest domyślnym folderem wyjściowym
          # Ustawienia GitHub Pages
          github_token: ${{ secrets.GITHUB_TOKEN }}  # GitHub automatycznie generuje ten token
          target_branch: gh-pages  # Gałąź, na którą ma zostać opublikowana strona